name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adoption/package-lock.json
      - run: npm ci
      - run: npm run build
      # Second app: adoption adjudicator, served under ./adoption/ (relative
      # base + HashRouter + own service-worker scope — no URL collisions;
      # the root app's SW denylists /adoption/ navigations).
      - run: npm ci
        working-directory: adoption
      - run: npm run build
        working-directory: adoption
      - run: mv adoption/dist dist/adoption
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

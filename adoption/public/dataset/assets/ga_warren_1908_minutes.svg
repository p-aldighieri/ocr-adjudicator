<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <!-- Placeholder facsimile shipped with the SAMPLE dataset only. -->
  <rect width="800" height="1100" fill="#efe8d8"/>
  <rect x="0" y="0" width="800" height="1100" fill="none" stroke="#d3c9b0" stroke-width="6"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2b271f">
    <text x="400" y="86" font-size="24" text-anchor="middle" letter-spacing="2">WARREN COUNTY BOARD OF EDUCATION</text>
    <text x="400" y="118" font-size="18" text-anchor="middle">Warrenton, Georgia — Minutes, Book B, p. 41</text>
    <line x1="60" y1="140" x2="740" y2="140" stroke="#d9cfb6" stroke-width="2"/>
    <text x="60" y="196" font-size="19">April 6th, 1908. (entry partly obscured by water damage)</text>
    <text x="60" y="246" font-size="19">Resolved, that the readers heretofore used be discontinued and</text>
    <text x="60" y="276" font-size="19">that the ▨▨▨▨▨ Fourth Reader be adopted in lieu thereof, the</text>
    <text x="60" y="306" font-size="19">adoption to run for four years from the beginning of the fall term.</text>
    <text x="60" y="366" font-size="19">The publisher's agent, Mr. ▨▨▨▨, appeared and submitted terms.</text>
    <text x="60" y="426" font-size="19" font-style="italic">[margin, later hand:] "see contract filed 16 April 1908"</text>
    <rect x="55" y="440" width="690" height="120" fill="#ded3ba" opacity="0.55"/>
    <text x="60" y="600" font-size="19">Adjourned to meet on the first Monday in May.</text>
    <text x="470" y="670" font-size="19" font-style="italic">T. E. Cody, Secretary</text>
  </g>
  <text x="60" y="1060" font-family="Georgia, serif" font-size="14" fill="#8f8570">sample facsimile — not a real scan</text>
</svg>
